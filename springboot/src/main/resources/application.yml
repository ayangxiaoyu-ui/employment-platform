server:
  port: 9999
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/employment_platform?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开启控制台打印SQL，方便调试
    map-underscore-to-camel-case: true # 开启下划线转驼峰
  global-config:
    db-config:
      logic-delete-field: deleted # 逻辑删除字段(如果有的话)
