spring:
  datasource:
    url: jdbc:mysql://localhost:3306/employment_platform?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  # 建议加上文件上传大小限制（默认值较小）
  servlet:
    multipart:
      max-file-size: 10MB     # 单个文件最大大小
      max-request-size: 10MB  # 整个请求最大大小

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开启SQL日志
    map-underscore-to-camel-case: true                     # 下划线转驼峰
  global-config:
    db-config:
      logic-delete-field: deleted   # 如果你的表有逻辑删除字段

# 文件上传相关配置
file:
  upload:
    # 开发环境放在 static 目录下时，推荐使用相对路径
    # 注意：从项目根目录算起，而不是从 src 目录算起
#    avatar-path: src/main/resources/static/uploads/avatar/
    # 或者更推荐：使用 classpath: 前缀（Spring Boot 更熟悉这种写法）
    # avatar-path: classpath:static/uploads/avatar/
    avatar-path: /Users/pae-uneon/Desktop/code/springboot/src/main/resources/static/uploads/avatar/
    avatar-url-prefix: /uploads/avatar/
    logo-path: /Users/pae-uneon/Desktop/code/springboot/src/main/resources/static/uploads/logo/
    logo-url-prefix: /uploads/logo/
    # 访问前缀
    # 如果放在 static 目录下，且没有额外配置 ResourceHandler，访问路径应该是 /uploads/avatar/xxx.jpg
    # 所以 avatar-url-prefix 应该改为：
#    avatar-url-prefix: http://localhost:9999/uploads/avatar/
    # 或者更灵活，只存相对路径，实际使用时拼接域名
    # avatar-url-prefix: /uploads/avatar/